<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>import payment</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="20" fill="#0b1220"><text x="30" y="43">The same US$100 bill, two exchange rates</text><rect x="30" y="80" width="310" height="235" rx="16" fill="white" stroke="#0f766e"/><rect x="380" y="80" width="310" height="235" rx="16" fill="white" stroke="#0f766e"/><text x="55" y="127">USD/BRL 5.00</text><text x="55" y="185">100 × 5.00</text><text x="55" y="251" fill="#0f766e">Pay R$500</text><text x="405" y="127">USD/BRL 5.20</text><text x="405" y="185">100 × 5.20</text><text x="405" y="251" fill="#0f766e">Pay R$520</text><text x="30" y="365">R$20 more = 4% of the first bill; before fees</text></g></svg>