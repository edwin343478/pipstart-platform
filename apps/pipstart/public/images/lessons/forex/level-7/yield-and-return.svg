<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>yield and return</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="28" fill="#0b1220"><text x="30" y="43">Asset return and currency return both matter</text><rect x="30" y="82" width="660" height="220" rx="16" fill="white" stroke="#0f766e"/><text x="55" y="127">Initial home value: £100</text><text x="55" y="178">Foreign asset return: × 1.04</text><text x="55" y="229">Currency’s home value: × 0.92</text><text x="55" y="280" fill="#0f766e">Final home value: £95.68</text><text x="30" y="348">4% gain locally, 8% currency fall</text><text x="30" y="384">Home return: −4.32%; before fees and taxes</text></g></svg>