<svg xmlns="http://www.w3.org/2000/svg" width="600" height="525" viewBox="0 0 600 525" role="img" aria-labelledby="title description">
<title id="title">Same pip, different position size</title><desc id="description">For EUR/USD with a conventional 0.0001 pip and a USD account, 1,000 euro units have a value of 10 US cents per pip, 10,000 have a value of 1 dollar, and 100,000 have a value of 10 dollars, before costs. These are arithmetic examples, not recommended sizes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs>
<rect x="1" y="1" width="598" height="523" rx="22" fill="#f0fdfa" stroke="#99f6e4"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#0b1220">
<text x="300" y="40" font-size="26" font-weight="700">Same pip, different position size</text>
<rect x="30" y="66" width="540" height="106" rx="16" fill="#fff" stroke="#99f6e4"/>
<text x="300" y="96" font-size="23" font-weight="700">Micro: 1,000 EUR units</text>
<text x="300" y="130" font-size="29" fill="#0f766e" font-weight="700">US$0.10 per pip</text>
<text x="300" y="156" font-size="20">0.01 standard lots at this convention</text>
<rect x="30" y="206" width="540" height="106" rx="16" fill="#fff" stroke="#99f6e4"/>
<text x="300" y="236" font-size="23" font-weight="700">Mini: 10,000 EUR units</text>
<text x="300" y="270" font-size="29" fill="#0f766e" font-weight="700">US$1 per pip</text>
<text x="300" y="296" font-size="20">0.1 standard lots at this convention</text>
<rect x="30" y="346" width="540" height="106" rx="16" fill="#fff" stroke="#99f6e4"/>
<text x="300" y="376" font-size="23" font-weight="700">Standard: 100,000 EUR units</text>
<text x="300" y="410" font-size="29" fill="#0f766e" font-weight="700">US$10 per pip</text>
<text x="300" y="436" font-size="20">1 standard lot at this convention</text>
<text x="300" y="508" font-size="20" fill="#475569">Illustrative example, not a live quote.</text>
</g>
</svg>
