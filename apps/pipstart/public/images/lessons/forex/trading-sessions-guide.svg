<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title description">
<title id="title">Illustrative Forex session windows in UTC</title><desc id="description">Reference windows: Sydney 22:00 to 07:00 across midnight, Tokyo 00:00 to 09:00, London 08:00 to 17:00, and New York 13:00 to 22:00. London and New York use winter hours; Sydney is shown at its local winter convention separately. This is not a date-specific timetable. The shaded London-New York overlap is 13:00 to 17:00 UTC.</desc>
<rect x="1" y="1" width="598" height="368" rx="22" fill="#f0fdfa" stroke="#99f6e4"/>
<g font-family="Arial, sans-serif" fill="#0b1220">
<text x="300" y="35" text-anchor="middle" font-size="25" font-weight="700">Reference session windows in UTC</text>
<text x="300" y="62" text-anchor="middle" font-size="18">Teaching convention; check the date and provider</text>
<rect x="373" y="77" width="68" height="206" fill="#99f6e4" opacity="0.6"/>
<text x="20" y="108" font-size="23">Sydney</text>
<rect x="152" y="90" width="408" height="24" rx="5" fill="#e2e8f0"/>
<rect x="152" y="90" width="119" height="24" rx="5" fill="#0f766e"/>
<rect x="526" y="90" width="34" height="24" rx="5" fill="#0f766e"/>
<text x="20" y="158" font-size="23">Tokyo</text>
<rect x="152" y="140" width="408" height="24" rx="5" fill="#e2e8f0"/>
<rect x="152" y="140" width="153" height="24" rx="5" fill="#0f766e"/>
<text x="20" y="208" font-size="23">London</text>
<rect x="152" y="190" width="408" height="24" rx="5" fill="#e2e8f0"/>
<rect x="288" y="190" width="153" height="24" rx="5" fill="#0f766e"/>
<text x="20" y="258" font-size="23">New York</text>
<rect x="152" y="240" width="408" height="24" rx="5" fill="#e2e8f0"/>
<rect x="373" y="240" width="153" height="24" rx="5" fill="#0f766e"/>
<text x="152" y="303" text-anchor="middle" font-size="21">00</text>
<text x="254" y="303" text-anchor="middle" font-size="21">06</text>
<text x="356" y="303" text-anchor="middle" font-size="21">12</text>
<text x="458" y="303" text-anchor="middle" font-size="21">18</text>
<text x="560" y="303" text-anchor="middle" font-size="21">24</text>
<text x="300" y="339" text-anchor="middle" font-size="19">Shading: London / New York, 13:00–17:00</text>
</g></svg>
