<svg xmlns="http://www.w3.org/2000/svg" width="600" height="525" viewBox="0 0 600 525" role="img" aria-labelledby="title description">
<title id="title">A payment through the network</title><desc id="description">A Mexican importer needs 1,000 US dollars for a supplier invoice. Its bank or payment provider quotes a conversion under its own arrangements. The supplier receives the agreed dollar payment. The participants have different roles and responsibilities.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs>
<rect x="1" y="1" width="598" height="523" rx="22" fill="#f0fdfa" stroke="#99f6e4"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#0b1220">
<text x="300" y="40" font-size="26" font-weight="700">A payment through the network</text>
<rect x="30" y="66" width="540" height="106" rx="16" fill="#fff" stroke="#99f6e4"/>
<text x="300" y="96" font-size="23" font-weight="700">Importer in Mexico</text>
<text x="300" y="130" font-size="29" fill="#0f766e" font-weight="700">Needs US$1,000</text>
<text x="300" y="156" font-size="20">A real supplier invoice, not a prediction.</text>
<rect x="30" y="206" width="540" height="106" rx="16" fill="#fff" stroke="#99f6e4"/>
<text x="300" y="236" font-size="23" font-weight="700">Bank or payment provider</text>
<text x="300" y="270" font-size="29" fill="#0f766e" font-weight="700">Quotes a rate and charges</text>
<text x="300" y="296" font-size="20">Sources dollars under its arrangements.</text>
<rect x="30" y="346" width="540" height="106" rx="16" fill="#fff" stroke="#99f6e4"/>
<text x="300" y="376" font-size="23" font-weight="700">Supplier in the United States</text>
<text x="300" y="410" font-size="29" fill="#0f766e" font-weight="700">Receives the agreed payment</text>
<text x="300" y="436" font-size="20">The invoice is priced in US dollars.</text>
<text x="300" y="508" font-size="20" fill="#475569">Illustrative example, not a live quote.</text>
</g>
<path d="M300 179V200" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M300 319V340" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
