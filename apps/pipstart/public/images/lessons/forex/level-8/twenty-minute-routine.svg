<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>twenty minute routine</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="28" fill="#0b1220"><text x="30" y="43">A twenty-minute teaching routine</text><rect x="30" y="85" width="150" height="225" rx="14" fill="white" stroke="#0f766e"/><rect x="195" y="85" width="330" height="225" rx="14" fill="white" stroke="#0f766e"/><rect x="540" y="85" width="150" height="225" rx="14" fill="white" stroke="#0f766e"/><text x="50" y="140" fill="#0f766e">5 min</text><text x="50" y="215">Prepare</text><text x="220" y="140" fill="#0f766e">10 min</text><text x="220" y="215">One observation</text><text x="560" y="140" fill="#0f766e">5 min</text><text x="560" y="215">Record</text><text x="30" y="355">5 + 10 + 5 = 20 minutes</text><text x="30" y="389">No setup or a valid skip still belongs in the log</text></g></svg>