<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>pause and check</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="20" fill="#0b1220"><text x="30" y="43">An urge is not an entry condition</text><rect x="30" y="70" width="660" height="60" rx="14" fill="white" stroke="#0f766e"/><text x="55" y="110">Notice the urge; save the facts</text><path d="M360 132 L360 163 M352 154 L360 164 L368 154" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="30" y="170" width="660" height="60" rx="14" fill="white" stroke="#0f766e"/><text x="55" y="210">Check the saved rule and gates</text><path d="M180 232 L180 263 M172 254 L180 264 L188 254 M540 232 L540 263 M532 254 L540 264 L548 254" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="30" y="270" width="310" height="88" rx="14" fill="white" stroke="#0f766e"/><rect x="380" y="270" width="310" height="88" rx="14" fill="white" stroke="#0f766e"/><text x="50" y="305">All gates pass</text><text x="50" y="343" fill="#0f766e">Permitted action</text><text x="400" y="305">Absent or unclear</text><text x="400" y="343" fill="#0f766e">No new action</text><text x="30" y="389">Record the decision; handle existing exposure</text></g></svg>