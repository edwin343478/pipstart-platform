<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>process and outcome</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="20" fill="#0b1220"><text x="30" y="43">Process and outcome are different questions</text><rect x="30" y="75" width="310" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="50" y="122">Rule followed</text><text x="50" y="166" fill="#0f766e">Later gain</text><rect x="380" y="75" width="310" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="400" y="122">Rule followed</text><text x="400" y="166" fill="#0f766e">Later loss</text><rect x="30" y="230" width="310" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="50" y="277">Rule breached</text><text x="50" y="321" fill="#0f766e">Later gain</text><rect x="380" y="230" width="310" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="400" y="277">Rule breached</text><text x="400" y="321" fill="#0f766e">Later loss</text><text x="30" y="389">A gain does not erase a rule breach</text></g></svg>