<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>changing relationships</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="28" fill="#0b1220"><text x="30" y="43">Different pairs can share one exposure</text><rect x="30" y="85" width="310" height="180" rx="14" fill="white" stroke="#0f766e"/><rect x="380" y="85" width="310" height="180" rx="14" fill="white" stroke="#0f766e"/><text x="55" y="135">Long EUR/USD</text><text x="55" y="200" fill="#0f766e">Buy EUR; sell USD</text><text x="405" y="135">Long GBP/USD</text><text x="405" y="200" fill="#0f766e">Buy GBP; sell USD</text><text x="30" y="325">Measure each window; keep its dates</text><text x="30" y="379">Co-movement is not a future promise</text></g></svg>