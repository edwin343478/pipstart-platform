<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>portfolio review</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="20" fill="#0b1220"><text x="30" y="43">Review one complete account scenario</text><rect x="30" y="85" width="310" height="195" rx="14" fill="white" stroke="#0f766e"/><rect x="380" y="85" width="310" height="195" rx="14" fill="white" stroke="#0f766e"/><text x="55" y="135">Planned price loss</text><text x="55" y="197" fill="#0f766e">8 + 10 + 12 = 30</text><text x="55" y="253">Charges 3: total 33</text><text x="405" y="135">Adverse price loss</text><text x="405" y="197" fill="#0f766e">10 + 13 + 17 = 40</text><text x="405" y="253">Charges 3: total 43</text><text x="30" y="337">All amounts CAD; assumptions matter</text><text x="30" y="385">Scenario, not a maximum-loss promise</text></g></svg>