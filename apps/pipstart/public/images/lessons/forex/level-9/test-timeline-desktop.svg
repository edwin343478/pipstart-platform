<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img"><title>test timeline</title><rect width="720" height="400" rx="24" fill="#f0fdfa"/><g font-family="Arial,sans-serif" font-size="20" fill="#0b1220"><text x="30" y="43">Keep the testing sequence chronological</text><rect x="30" y="85" width="210" height="220" rx="14" fill="white" stroke="#0f766e"/><rect x="255" y="85" width="210" height="220" rx="14" fill="white" stroke="#0f766e"/><rect x="480" y="85" width="210" height="220" rx="14" fill="white" stroke="#0f766e"/><text x="50" y="145" fill="#0f766e">Jan–Jun</text><text x="50" y="219">Develop</text><text x="275" y="145" fill="#0f766e">Jul–Sep</text><text x="275" y="219">Evaluate</text><text x="500" y="145" fill="#0f766e">Later</text><text x="500" y="219">Forward</text><text x="30" y="350">Freeze the rule before viewing later data</text><text x="30" y="389">Viewed evaluation is no longer unseen</text></g></svg>