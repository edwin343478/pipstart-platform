name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify M17 guarded audit records
        run: |
          node scripts/verify-m17-publication-readiness.mjs
          node scripts/verify-m17-reviewed-integration.mjs
          node scripts/verify-m17-release.mjs
          node scripts/verify-m17-targeted-sources-2.mjs
          node scripts/verify-m17-glossary-editorial.mjs
          node scripts/verify-m17-glossary-arithmetic.mjs
          node scripts/verify-m17-course-context.mjs
          node scripts/verify-m17-targeted-sources-1.mjs
          node scripts/verify-m17-browser-results.mjs --self-test

      - name: Start isolated local Supabase for production browser grading
        timeout-minutes: 15
        run: node apps/pipstart/scripts/configure-m16-ci-supabase.mjs

      - name: Build applications
        run: pnpm build

      - name: Verify public lesson bundles
        run: pnpm --filter pipstart verify:public-bundles

      - name: Install Chromium for publication smoke checks
        run: pnpm --filter pipstart exec playwright install --with-deps chromium

      - name: Verify approved public M17 glossary on desktop and mobile
        timeout-minutes: 20
        run: |
          pnpm --filter pipstart exec node scripts/verify-m17-browser-environment.mjs
          pnpm --filter pipstart exec playwright test --config=playwright.m17.config.ts
          node scripts/verify-m17-browser-results.mjs

      - name: Verify reviewed M17 catalogue on desktop and mobile
        timeout-minutes: 20
        env:
          PIPSTART_M17_GLOSSARY_REVIEW: "1"
        run: |
          pnpm --filter pipstart exec node scripts/verify-m17-browser-environment.mjs
          pnpm --filter pipstart exec playwright test --config=playwright.m17.config.ts
          node scripts/verify-m17-browser-results.mjs

      - name: Preserve M17 glossary browser results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipstart-m17-browser-results
          path: |
            apps/pipstart/playwright-report/m17
            apps/pipstart/test-results/m17
            apps/pipstart/playwright-report/m17-review
            apps/pipstart/test-results/m17-review
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Crypto levels and approved publication interactions
        timeout-minutes: 25
        run: pnpm --filter pipstart test:e2e:m16

      - name: Preserve Crypto browser verification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipstart-m16-browser-results
          path: |
            apps/pipstart/playwright-report/m16
            apps/pipstart/test-results/m16
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated CI Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  assessment-live:
    name: Live learner release gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: assessment-release
    env:
      PIPSTART_M13_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PIPSTART_M13_SUPABASE_PUBLISHABLE_KEY }}
      PIPSTART_M13_SUPABASE_SECRET_KEY: ${{ secrets.PIPSTART_M13_SUPABASE_SECRET_KEY }}
      PIPSTART_M13_SUPABASE_URL: ${{ secrets.PIPSTART_M13_SUPABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter pipstart exec playwright install --with-deps chromium

      - name: Run live assessment release gate
        run: pnpm --filter pipstart test:e2e:assessment-release

      - name: Run live dashboard release gate
        run: pnpm --filter pipstart test:e2e:dashboard-release

      - name: Verify authenticated Crypto persistence against production
        timeout-minutes: 15
        run: pnpm --filter pipstart test:e2e:m16-authenticated
